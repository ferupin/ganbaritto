name: Erro em questão ou gabarito
description: Enunciado confuso, gabarito errado ou resposta-modelo duvidosa nos bancos de exemplo
labels: [conteudo]
body:
  - type: input
    id: banco
    attributes:
      label: Banco (id ou título)
      placeholder: exemplo-matematica-8ano-v1
    validations:
      required: true
  - type: input
    id: questao
    attributes:
      label: Número da questão
    validations:
      required: true
  - type: textarea
    id: problema
    attributes:
      label: O que está errado
    validations:
      required: true
  - type: textarea
    id: fonte
    attributes:
      label: Fonte que confirma a correção
      description: Só indique fontes reais que você consultou.
