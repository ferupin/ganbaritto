name: Algo não funciona
description: Um erro, travamento ou comportamento inesperado
labels: [bug]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
      description: Conte o que você viu e o que esperava ver.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como repetir
      placeholder: "1. Abrir a Biblioteca\n2. Clicar em ...\n3. ..."
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 140, Windows 11
  - type: input
    id: versao
    attributes:
      label: Versão do app
      description: Aparece na página /versoes.
  - type: markdown
    attributes:
      value: Não cole dados pessoais de estudantes nem provas reais com nomes.
